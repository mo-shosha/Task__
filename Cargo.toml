[package]
name = "products"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
shared.workspace = true
module-categories.workspace = true
module-products.workspace = true
module-images.workspace = true
module-authentication.workspace = true


[workspace]
resolver = "3"
members = [
    "cornucopia",
    "crates/shared",
    "modules/categories",
    "modules/products",
    "modules/images", 
    "modules/authentication",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
argon2 = "0.6"
rand = "0.10.3"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
cornucopia = { path = "cornucopia" }
shared = { path = "crates/shared" }
module-categories = { path = "modules/categories" }
module-products = { path = "modules/products" }
module-images = { path = "modules/images" }
module-authentication = { path = "modules/authentication" }
