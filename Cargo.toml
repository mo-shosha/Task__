[package]
name = "products"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
shared.workspace = true
module-categories.workspace = true
module-products.workspace = true
module-images.workspace = true

[workspace]
resolver = "3"
members = [
    "cornucopia",
    "crates/shared",
    "modules/categories",
    "modules/products",
    "modules/images",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
cornucopia = { path = "cornucopia" }
shared = { path = "crates/shared" }
module-categories = { path = "modules/categories" }
module-products = { path = "modules/products" }
module-images = { path = "modules/images" }
